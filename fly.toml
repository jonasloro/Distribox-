# Configuração de hospedagem no Fly.io (equivalente ao railway.toml).
# Passo a passo em HOSPEDAGEM_FLY.md

primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  OUTLOG_DATA_DIR = "/app/data"   # SQLite + uploads ficam no volume abaixo

# Volume persistente: sem ele o SQLite e os uploads somem a cada deploy.
# Volume só existe em UMA máquina, então o app roda com uma máquina só.
[mounts]
  source = "outlog_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "10s"
    grace_period = "40s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
